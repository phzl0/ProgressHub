name: Community MVP checks
on:
  push:
    branches: [feat/github-community-mvp]
  pull_request:
    paths:
      - 'server/**'
      - 'client/src/components/Community/**'
      - '.github/workflows/community-mvp.yml'
jobs:
  community:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend dependencies
        working-directory: server
        run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Test scoring, migration, concurrency and season closure
        working-directory: server
        env:
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017
        run: npm test
      - name: Install frontend dependencies
        working-directory: client
        run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Test community navigation and refresh
        working-directory: client
        env:
          CI: 'true'
        run: npm test -- --watchAll=false --runInBand --runTestsByPath src/components/Community/Community.test.js src/components/Community/Missions.test.js src/components/Community/ProfileEditor.test.js src/components/Community/Engagement.test.js src/components/Community/Reliability.test.js src/components/Community/Cosmetics.test.js src/components/Community/Achievements.test.js src/components/Community/HomeBanners.test.js src/components/Community/CommunityChat.test.js
      - name: Build frontend
        working-directory: client
        run: npm run build
